[project]
name = "zq-django-template"
version = "0.2.0"
description = "自强 Studio Django 现代化后端模板"
authors = [
    { name = "Ziqiang Studio", email = "tech@ziqiang.net.cn" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.6.0",
    "drf-spectacular>=0.28.0",
    "django-filter>=24.3",
    "mysqlclient>=2.2.6",
    "pillow>=10.4.0",
    "django-split-settings>=1.3.1",
    "python-decouple>=3.8",
    "loguru>=0.7.3",
    "redis>=5.2.0",
    "django-cache-url>=3.4.5",
    "dj-database-url>=2.3.0",
    "zq-django-util>=0.2.2",
    "zq-auth-sdk>=0.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
    "django-extensions>=3.2.3",
    "werkzeug>=3.1.3",
    "django-debug-toolbar>=4.4.6",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "pytest-mock>=3.14.0",
    "model-bakery>=1.20.0",
    "pytest-xdist>=3.6.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "pytest-mock>=3.14.0",
    "model-bakery>=1.20.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
ignore = ["E501", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["server"]
