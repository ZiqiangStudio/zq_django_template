name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml pytest pytest-django pytest-mock model-bakery ruff

      - name: Run code linter
        run: ruff check server tests

      - name: Run tests
        run: pytest

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ZiqiangStudio/zq-deploy/.github/workflows/reusable-container.yml@main
    secrets: inherit
    with:
      port: "8000"
      domain: ${{ vars.DOMAIN }}
